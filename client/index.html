<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%232f6d5e%22/><path d=%22M15 42 31 16l18 26H15Zm13-7 5-8 6 8H28Z%22 fill=%22%23fff%22/></svg>" />
    <title>Mastery Roadmap</title>
    <script>
      (() => {
        const ids = ['morning-mist', 'forest-dusk', 'blue-harbor', 'deep-ocean', 'lavender-still', 'night-lavender', 'warm-sand', 'cocoa-evening', 'sage-garden', 'moss-night', 'rosewater', 'plum-twilight', 'quiet-linen', 'graphite-calm', 'sea-glass', 'midnight-ink']
        const aliases = { 'living-atlas': 'morning-mist', 'curiosity-engine': 'blue-harbor', 'mission-workshop': 'forest-dusk' }
        let theme = 'morning-mist'
        try {
          const versionedTheme = localStorage.getItem('mastery-trail-theme-v2')
          const legacyTheme = localStorage.getItem('mastery-roadmap-theme')
          const storedTheme = versionedTheme || (legacyTheme ? 'living-atlas' : null)
          const resolvedTheme = aliases[storedTheme] || storedTheme
          if (ids.includes(resolvedTheme)) theme = resolvedTheme
        } catch {
          // The default theme is painted when browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = ['forest-dusk', 'deep-ocean', 'night-lavender', 'cocoa-evening', 'moss-night', 'plum-twilight', 'graphite-calm', 'midnight-ink'].includes(theme) ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
